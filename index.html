<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>자라섬 키우기</title>
<style>
:root{--bg:#f6f2f7;--paper:#fff;--ink:#433847;--muted:#988b9b;--line:#e9e0eb;--accent:#ad83ad;--accent2:#806a95;--soft:#f0e7f1;--green:#dfead9;--shadow:0 8px 30px #54415a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}#app{max-width:760px;margin:auto;min-height:100vh;background:#faf8fb;position:relative;padding-bottom:82px}
.top{height:62px;padding:12px 17px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:950;letter-spacing:1.5px;color:#9c759f;font-size:13px}.topright{font-size:11px;color:var(--muted);text-align:right}
.wrap{padding:15px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#aa85a8;font-weight:900}.title{font-size:22px;font-weight:900;letter-spacing:-.6px;margin:5px 0 12px}.sub{font-size:12px;color:var(--muted);line-height:1.65}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.hero{border:0;overflow:hidden;position:relative;background:linear-gradient(130deg,#eadfed,#f6e7ee);min-height:145px;padding:17px}
.hero h2{font-size:20px;margin:0 0 7px}.hero p{font-size:12px;line-height:1.65;color:#766879;max-width:65%}.hero .art{position:absolute;right:8px;bottom:-7px;font-size:84px;filter:drop-shadow(0 6px 3px #77647720)}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.stat{background:#f8f5f8;border-radius:12px;padding:9px 6px;text-align:center}.stat label{display:block;color:#a396a3;font-size:9px}.stat strong{display:block;font-size:13px;margin-top:4px}.meter{height:4px;background:#eae3eb;border-radius:4px;margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;background:#b08ab0;border-radius:4px}
.btn{width:100%;border:0;border-radius:13px;background:#a984a8;color:white;font-weight:850;padding:13px;margin-top:7px}.btn.secondary{background:#f0e7f0;color:#866c8d}.btn.ghost{background:white;border:1px solid var(--line);color:#827185}
.listbtn{display:flex;align-items:center;gap:11px;text-align:left;width:100%;background:white;border:1px solid var(--line);border-radius:14px;padding:11px;margin:7px 0}.iconbox{width:38px;height:38px;border-radius:12px;background:#f0e8f2;display:grid;place-items:center;font-size:19px;flex:none}.listbtn b{font-size:12px;display:block}.listbtn small{font-size:10px;color:var(--muted);display:block;margin-top:3px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);z-index:6;padding:5px 2px max(5px,env(safe-area-inset-bottom))}.bottom button{border:0;background:none;color:#a69aa8;font-size:9px;padding:4px}.bottom button.active{color:#986f9a;font-weight:900}.bottom span{display:block;font-size:19px;margin-bottom:1px}
.scene{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.scenehead{padding:14px;background:linear-gradient(120deg,#f0e7f2,#f9edf0);display:flex;align-items:center;gap:12px}.portrait{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:34px;background:#fff9;flex:none}.scenehead h3{margin:0;font-size:14px}.scenehead small{color:#938295;font-size:10px}.storytext{padding:17px;font-size:14px;line-height:2;white-space:pre-line;min-height:155px}.speaker{font-weight:900;color:#a17da1;font-size:11px;margin-bottom:8px}.choices{padding:0 13px 14px}.choice{width:100%;background:#fff;border:1px solid #e7dce9;border-radius:13px;text-align:left;padding:12px 13px;margin:6px 0;font-size:12px;line-height:1.6;transition:.15s}.choice:hover{background:#f7f0f7;border-color:#c8adc8}.choice em{display:block;font-style:normal;color:#a394a4;font-size:10px;margin-top:4px}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.char{border:1px solid var(--line);border-radius:15px;background:white;padding:10px 6px;text-align:center}.char.selected{border:2px solid #b18ab1;background:#fbf6fb}.char .face{height:74px;border-radius:13px;display:grid;place-items:center;font-size:43px;margin-bottom:8px}.char b{display:block;font-size:12px}.char small{font-size:9px;color:var(--muted)}
.chat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px}.msg{padding:10px 11px;border-radius:13px;background:#f0e8f2;margin:7px 0;max-width:88%;font-size:12px;line-height:1.6}.msg.mine{margin-left:auto;background:#e6efdf}.msg .who{font-size:10px;font-weight:900;color:#927293;margin-bottom:3px}
.row{display:flex;gap:7px}.row>*{flex:1}.smallpill{display:inline-block;padding:5px 8px;background:#f0e7f1;border-radius:30px;color:#9b779d;font-size:10px;font-weight:800}
.event{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f0eaf0}.event:last-child{border:0}.event .time{width:44px;color:#a582a6;font-size:11px;font-weight:900}.event b{font-size:12px}.event small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.overlay{position:fixed;inset:0;background:#3d2d3d88;z-index:20;display:grid;place-items:center;padding:16px}.modal{width:min(520px,100%);background:white;border-radius:20px;padding:18px;max-height:90vh;overflow:auto}.modal h2{font-size:19px;margin:0 0 7px}.modal p{font-size:12px;line-height:1.7;color:#7e7182}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calgrid div{padding:8px 3px;text-align:center;border-radius:8px;font-size:10px;background:#f6f2f6}.calgrid .today{background:#e8dceb;color:#8b668d;font-weight:900}
@media(min-width:600px){.wrap{padding:22px}.chars{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="app"></div>
<script>
const members=[
{name:"다래",emoji:"🍑",color:"#f4dfd0",tag:"계획적인 전략가",intro:"계획을 세우는 건 자신 있지만, 예상대로 흘러가지 않는 하루를 받아들이는 게 쉽지 않다.",route:"계획과 현실 사이"},
{name:"루뭉",emoji:"🐰",color:"#dfe7f7",tag:"신중한 막내",intro:"말을 꺼내기 전에 몇 번씩 생각한다. 첫 방송을 앞두고 작은 걱정들이 자꾸 커진다.",route:"첫 발을 내딛는 용기"},
{name:"으네",emoji:"🌰",color:"#e9d9d2",tag:"당당한 자기표현",intro:"자신감 있어 보인다는 말을 자주 듣지만, 아무도 모르는 기준을 혼자 세워두고 있다.",route:"내 기준의 성공"},
{name:"돗챠",emoji:"🍓",color:"#f3dce8",tag:"먹방과 콘텐츠",intro:"맛있는 걸 먹고 이야기하는 건 즐겁다. 하지만 즐거움을 콘텐츠로 만들 때 생기는 부담도 있다.",route:"좋아하는 일을 계속하려면"},
{name:"하밍",emoji:"🌼",color:"#f3e7d0",tag:"장난꾸러기",intro:"분위기를 띄우는 건 익숙하다. 진지한 이야기가 나오면 농담으로 피하는 버릇이 있다.",route:"웃음 뒤에 있는 이야기"},
{name:"시로",emoji:"🐈",color:"#e3e3ed",tag:"차분한 감성",intro:"조용한 편이지만 하고 싶은 말이 없는 건 아니다. 자기 목소리를 찾는 시간이 필요하다.",route:"조용해도 괜찮아"},
{name:"빅윈",emoji:"👑",color:"#e4d9ef",tag:"책임감 있는 리더",intro:"멤버들을 챙기는 일이 먼저가 되다 보니, 자신의 계획은 늘 뒤로 밀린다.",route:"리더도 사람이다"},
{name:"뚜닝",emoji:"⚡",color:"#e5dce9",tag:"승부욕과 자존심",intro:"잘하고 싶은 마음이 크다. 결과가 기대에 못 미치면 웃어넘기기가 어렵다.",route:"지는 법과 다시 도전하는 법"},
{name:"도담히",emoji:"🌱",color:"#e2eddf",tag:"배우는 신입",intro:"아직 모르는 게 많지만, 모른다는 사실을 들키는 게 더 무섭다.",route:"처음이라서"}
];
const initial={
day:1,weekday:0,time:"09:40",energy:72,stress:22,confidence:34,skill:12,followers:17,money:85000,affinity:0,storyStep:0,flags:{},logs:[],started:false,route:null
};
function cloneInitial(){return JSON.parse(JSON.stringify(initial));}
function safeLoad(){try{const raw=window.localStorage.getItem("jarasum_save_v2");if(!raw)return cloneInitial();const parsed=JSON.parse(raw);if(!parsed||typeof parsed!=="object"||!Number.isInteger(parsed.day)||!Number.isInteger(parsed.route)&&parsed.route!==null)return cloneInitial();return Object.assign(cloneInitial(),parsed);}catch(e){return cloneInitial();}}
let S=safeLoad();
let view="home",app=document.getElementById("app");
function save(){try{window.localStorage.setItem("jarasum_save_v2",JSON.stringify(S));return true;}catch(e){return false;}}
function m(){return members[S.route||1]}
function top(){return `<header class="top"><div class="brand">JARASUM LIFE</div><div class="topright">DAY ${S.day} · ${["월","화","수","목","금","토","일"][S.weekday]}<br>${S.time}</div></header>`}
function nav(){return `<nav class="bottom">${[['home','🏠','홈'],['story','📖','스토리'],['phone','💬','채팅'],['schedule','🗓️','일정'],['profile','👤','상태']].map(([id,ic,n])=>`<button class="${view===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${n}</button>`).join("")}</nav>`}
function stats(){return `<div class="statgrid">${[['컨디션',S.energy],['스트레스',S.stress],['자신감',S.confidence],['방송 실력',S.skill]].map(([n,v])=>`<div class="stat"><label>${n}</label><strong>${v}</strong><div class="meter"><i style="width:${v}%"></i></div></div>`).join("")}</div>`}
function home(){view="home";app.innerHTML=top()+`<main class="wrap"><section class="hero card" style="background:linear-gradient(130deg,${m().color},#f7edf4)"><h2>${m().name}의 일상</h2><p>${m().intro}<br><br>오늘 하루를 어떻게 보낼지는 직접 결정한다.</p><div class="art">${m().emoji}</div></section><div class="eyebrow" style="margin-top:17px">STATUS</div>${stats()}<div class="row"><div class="card" style="flex:1"><div class="eyebrow">FOLLOWERS</div><b style="font-size:20px">${S.followers.toLocaleString()}</b><small class="sub">명</small></div><div class="card" style="flex:1"><div class="eyebrow">WALLET</div><b style="font-size:20px">${S.money.toLocaleString()}</b><small class="sub">원</small></div></div><div class="eyebrow">TODAY</div><h2 class="title">오늘의 선택</h2><button class="listbtn" onclick="go('story')"><span class="iconbox">📖</span><div><b>스토리 진행</b><small>현재 에피소드와 중요한 선택</small></div></button><button class="listbtn" onclick="activity('broadcast')"><span class="iconbox">🎙️</span><div><b>방송하기</b><small>시간과 컨디션을 소비해 경험을 쌓는다</small></div></button><button class="listbtn" onclick="activity('practice')"><span class="iconbox">🎮</span><div><b>방송 연습</b><small>실력과 자신감을 조금씩 키운다</small></div></button><button class="listbtn" onclick="activity('rest')"><span class="iconbox">☕</span><div><b>휴식</b><small>컨디션을 회복하고 스트레스를 관리한다</small></div></button><button class="listbtn" onclick="activity('meet')"><span class="iconbox">👭</span><div><b>멤버와 만나기</b><small>관계와 개인 이야기에 영향을 준다</small></div></button><button class="btn secondary" onclick="endDay()">하루 마무리</button></main>`+nav()}
function choose(){view="select";app.innerHTML=top()+`<main class="wrap"><div class="eyebrow">CHARACTER ROUTE</div><h1 class="title">누구의 이야기를 시작할까?</h1><p class="sub">9명 각자의 현실적인 성장 이야기. 선택한 캐릭터의 일상과 고민을 따라간다.</p><div class="chars">${members.map((x,i)=>`<button class="char ${S.route===i?'selected':''}" onclick="selectRoute(${i})"><div class="face" style="background:${x.color}">${x.emoji}</div><b>${x.name}</b><small>${x.tag}</small></button>`).join("")}</div><button class="btn" onclick="startRoute()">이 캐릭터로 시작하기</button><button class="btn ghost" onclick="go('home')">돌아가기</button></main>`+nav()}
function scene(title,stage,text,choices){view="story";app.innerHTML=top()+`<main class="wrap"><div class="eyebrow">STORY · CHAPTER 01</div><section class="scene"><div class="scenehead"><div class="portrait" style="background:${m().color}">${m().emoji}</div><div><h3>${title}</h3><small>${stage}</small></div></div><div class="storytext">${text}</div><div class="choices">${choices.map((c,i)=>`<button class="choice" onclick="pick(${i})">${c.text}${c.note?`<em>${c.note}</em>`:""}</button>`).join("")}</div></section><p class="sub">선택은 능력치뿐 아니라 이후 대사와 사건에도 영향을 준다.</p></main>`+nav()}
const routeScenes=[
[
["오전 9시 40분 — 책상 앞","EP.01 · 계획표",`알람을 두 번 미루고 나서야 자리에서 일어났다.\n\n어제 적어둔 오늘의 계획표가 모니터 옆에 붙어 있다. 방송 준비, 썸네일 확인, 저녁 약속. 순서까지 정해뒀는데, 막상 컴퓨터를 켜자 예상하지 못한 업데이트가 걸린다.\n\n“……왜 하필 지금?”\n\n계획이 틀어졌다는 사실보다, 오늘을 어떻게 다시 정리해야 할지가 먼저 신경 쓰인다.`,[{text:"계획표를 다시 짜고 순서를 조정한다.",note:"방송 준비 능력 + · 스트레스 약간 증가",fx:{skill:2,stress:3}},{text:"일단 업데이트를 기다리며 아침을 먹는다.",note:"컨디션 회복 · 시간 소모",fx:{energy:7}},{text:"멤버에게 상황을 공유하고 도움을 구한다.",note:"관계 + · 자신감",fx:{affinity:2,confidence:2}}]],
["점심 — 예상과 다른 연락","EP.02 · 변수",`점심시간, 단체 채팅방에서 오늘 촬영 일정이 바뀌었다는 메시지가 올라온다.\n\n원래는 오후에 짧게 촬영하고 저녁 방송을 준비할 생각이었다. 그런데 한 멤버가 갑자기 시간이 안 된다고 한다. 다시 일정을 맞추려면 계획을 거의 전부 바꿔야 한다.\n\n다래는 잠깐 화면을 바라보다가 답장을 쓰기 시작한다.`,[{text:"가능한 시간대를 세 개 정리해 제안한다.",fx:{skill:2,stress:2}},{text:"이번 촬영은 다음으로 미루고 개인 방송에 집중한다.",fx:{confidence:2,stress:-2}},{text:"다른 멤버들에게 가능한지 먼저 물어본다.",fx:{affinity:2}}]],
["저녁 — 방송 직전","EP.03 · 첫 번째 시험",`방송 시작까지 20분. 오늘 준비한 콘텐츠는 계획대로 되지 않았지만, 최소한 시작할 수 있는 상태는 만들었다.\n\n화면에 대기방을 띄우고 마이크를 확인한다. 채팅창은 아직 비어 있다.\n\n“오늘은…… 계획대로 안 된 날이네.”\n\n그렇다고 방송까지 포기하고 싶지는 않다.`,[{text:"준비한 기획을 그대로 진행한다.",fx:{skill:3,confidence:1}},{text:"오늘 있었던 변수들을 솔직하게 이야기하는 방송으로 바꾼다.",fx:{confidence:3,affinity:1}},{text:"짧게 방송하고 컨디션을 지키기로 한다.",fx:{energy:3,stress:-3}}]]
],
[
["오전 10시 12분 — 방송 대기 화면","EP.01 · 첫 방송 전",`방송 시작 버튼을 누르기까지 커서가 몇 번이나 움직였다.\n\n마이크 테스트는 끝났다. 게임도 켜져 있다. 그런데 채팅창을 보니, 혹시 아무도 안 오면 어떡하지 하는 생각이 든다.\n\n루뭉은 휴대폰을 들었다가 내려놓는다. 도움을 요청할까, 아니면 스스로 시작해 볼까.\n\n방송은 결국 시작 버튼을 누르는 사람이 시작하는 거니까.`,[{text:"짧게라도 인사할 문장을 미리 적어둔다.",note:"자신감 + · 준비도 +",fx:{confidence:3,skill:1}},{text:"친한 멤버에게 응원 메시지를 부탁한다.",note:"관계 + · 부담 감소",fx:{affinity:2,stress:-2}},{text:"생각을 멈추고 바로 방송 시작을 누른다.",note:"용기 + · 긴장",fx:{confidence:2,stress:3}}]],
["첫 시청자","EP.02 · 낯선 사람",`방송을 켠 지 7분. 채팅에 첫 메시지가 올라왔다.\n\n“안녕하세요! 처음 들어왔어요.”\n\n짧은 문장이지만, 루뭉은 읽고 나서 잠깐 말을 멈춘다. 준비했던 인사말이 갑자기 어색해졌다. 시청자는 기다리고 있다.\n\n어떤 식으로 대답할까?`,[{text:"반갑게 인사하고 지금 하는 게임을 소개한다.",fx:{confidence:3,skill:2,followers:2}},{text:"“안녕하세요!”라고 먼저 말하고 자연스럽게 이어간다.",fx:{confidence:2,followers:1}},{text:"긴장해서 게임 설명부터 조용히 시작한다.",fx:{skill:1,stress:2}}]],
["방송 종료 후","EP.03 · 기록",`방송을 종료했다. 시청자 수는 많지 않았고, 중간에 말이 끊긴 순간도 있었다.\n\n그래도 한 명이 끝까지 남아 “오늘 방송 재밌었어요. 다음에도 올게요”라고 남겼다.\n\n루뭉은 방송 기록을 저장하고, 오늘의 자신에게 점수를 매기려다 그만둔다. 숫자로만 보면 놓치는 게 있을 것 같았다.`,[{text:"잘한 점 한 가지와 다음에 바꿀 점 한 가지를 적는다.",fx:{skill:2,confidence:2,stress:-1}},{text:"오늘은 기록만 남기고 푹 쉰다.",fx:{energy:5,stress:-4}},{text:"멤버들에게 방송 후기를 공유한다.",fx:{affinity:2,confidence:1}}]]
],
[
["오전 — 거울 앞","EP.01 · 자신감의 기준",`오늘도 준비는 빠르게 끝났다. 카메라 테스트 화면을 보며 으네는 표정을 확인한다.\n\n사람들은 늘 자신감 있다고 말한다. 실제로 무대에 서는 건 어렵지 않다. 다만 최근에는 결과가 마음에 들지 않을 때, 그걸 아무렇지 않은 척 넘기는 일이 점점 힘들다.\n\n오늘 방송은 어떤 방향으로 해볼까?`,[{text:"평소보다 솔직하고 편한 분위기를 만든다.",fx:{confidence:3,stress:-2}},{text:"준비한 목표를 확실히 달성하는 방송으로 간다.",fx:{skill:3,stress:2}},{text:"다른 멤버와 함께하는 방송을 제안한다.",fx:{affinity:2}}]],
["방송 중","EP.02 · 비교",`채팅에서 다른 방송 이야기가 나온다. 최근 잘된 콘텐츠, 높은 조회수, 반응 좋은 클립.\n\n으네는 웃으면서 대답하지만, 마음 한구석에 작은 비교가 시작된다. 자기도 더 잘할 수 있다고 생각한다. 하지만 그 생각이 오늘 방송을 망치게 하고 싶지는 않다.`,[{text:"시청자에게 자신이 좋아하는 콘텐츠를 이야기한다.",fx:{confidence:3}},{text:"다음 목표를 정하고 도전 콘텐츠를 제안한다.",fx:{skill:2,stress:3}},{text:"주제를 자연스럽게 바꾸고 현재 방송에 집중한다.",fx:{stress:-2,skill:1}}]],
["방송 후","EP.03 · 평가",`오늘 방송의 반응을 확인한다. 예상보다 괜찮은 부분도 있었고, 아쉬운 부분도 분명했다.\n\n으네는 결과를 인정하는 게 패배는 아니라는 걸 알고 있다. 다만 자신에게 그 말을 해주는 건 생각보다 어렵다.`,[{text:"잘된 점을 인정하고 다음 방송을 준비한다.",fx:{confidence:3,skill:2}},{text:"아쉬운 점을 분석해 연습 계획을 만든다.",fx:{skill:3,stress:2}},{text:"오늘은 결과 확인을 멈추고 휴식한다.",fx:{stress:-4,energy:5}}]]
]
];
function genericRouteScenes(idx){
const x=members[idx];
return [
[`오전 — 익숙한 방`,`EP.01 · ${x.route}`,`${x.intro}\n\n오늘은 평소와 조금 다른 계획을 세워보려 한다. 무작정 방송을 켜기보다는, 내가 무엇을 좋아하고 어떤 모습을 보여주고 싶은지 생각해보기로 했다.\n\n책상 위에는 메모장과 휴대폰, 어제 먹다 남은 음료가 놓여 있다.`,[{text:"오늘 해보고 싶은 콘텐츠를 적어본다.",fx:{skill:2,confidence:1}},{text:"멤버에게 같이 할 수 있는 일을 물어본다.",fx:{affinity:2}},{text:"우선 가볍게 방송을 켜고 분위기를 본다.",fx:{confidence:2,stress:2}}]],
[`예상 밖의 반응`,`EP.02 · 작은 사건`,`방송 중 예상하지 못한 일이 생겼다. 준비했던 흐름이 잠깐 끊기고, 채팅에서도 반응이 갈린다.\n\n당황스럽지만, 이런 순간도 방송의 일부다. 어떻게 대응하느냐에 따라 오늘의 기억이 달라질 수 있다.`,[{text:"상황을 솔직하게 설명하고 다시 진행한다.",fx:{confidence:2,skill:1}},{text:"준비한 다음 내용으로 빠르게 넘어간다.",fx:{skill:2}},{text:"잠깐 쉬고 마음을 정리한다.",fx:{stress:-3,energy:2}}]],
[`하루의 끝`,`EP.03 · 기록`,`방송을 마치고 방이 조용해졌다.\n\n오늘 완벽하진 않았지만, 새로운 경험 하나가 남았다. 작은 선택들이 쌓이면 언젠가는 지금과 다른 모습이 될지도 모른다.\n\n오늘의 기록을 남긴다.`,[{text:"오늘 느낀 점을 일기처럼 적는다.",fx:{confidence:2,stress:-1}},{text:"다음 목표를 하나만 정한다.",fx:{skill:2}},{text:"멤버와 대화하며 하루를 마무리한다.",fx:{affinity:2,stress:-2}}]]
]}
function startRoute(){if(S.route==null)return alert("캐릭터를 먼저 선택해줘!");S.started=true;S.storyStep=0;save();story()}
function story(){let scenes=routeScenes[S.route]||genericRouteScenes(S.route);let current=Math.min(S.storyStep,scenes.length-1);let [title,stage,text,choices]=scenes[current];scene(title,stage,text,choices)}
function pick(i){let scenes=routeScenes[S.route]||genericRouteScenes(S.route);let s=scenes[Math.min(S.storyStep,scenes.length-1)];let fx=s[3][i].fx||{};Object.entries(fx).forEach(([k,val])=>{if(k==="affinity")S.affinity+=val;else if(k==="followers")S.followers+=val;else S[k]=Math.max(0,Math.min(100,(S[k]||0)+val))});S.logs.push({day:S.day,route:S.route,step:S.storyStep,choice:i});S.storyStep++;if(S.storyStep>=scenes.length){S.storyStep=0;S.day++;S.weekday=(S.weekday+1)%7;S.time="09:40";S.energy=Math.max(5,S.energy-7);S.stress=Math.max(0,S.stress-2);S.confidence=Math.min(100,S.confidence);S.skill=Math.min(100,S.skill);save();chapterEnd()}else{save();story()}}
function chapterEnd(){view="story";app.innerHTML=top()+`<main class="wrap"><div class="card" style="text-align:center;padding:24px"><div style="font-size:44px">🌙</div><div class="eyebrow">EPISODE COMPLETE</div><h2 class="title">오늘의 이야기가 끝났다</h2><p class="sub">선택이 기록되었다. 다음 날은 새로운 일정과 사건이 기다리고 있다.</p>${stats()}<button class="btn" onclick="home()">일상으로</button><button class="btn secondary" onclick="story()">다음 이야기</button></div></main>`+nav()}
function activity(type){let result="";if(type==="broadcast"){if(S.energy<15){alert("컨디션이 너무 낮다. 먼저 쉬는 게 좋겠다.");return}S.energy-=18;S.stress+=5;S.skill=Math.min(100,S.skill+2);S.followers+=Math.random()<.5?1:2;S.money+=1500;result="방송을 마쳤다. 오늘의 기록과 작은 수익이 남았다."}if(type==="practice"){S.energy-=10;S.skill=Math.min(100,S.skill+3);S.confidence=Math.min(100,S.confidence+1);result="연습을 했다. 눈에 띄는 성과는 아니지만 조금 익숙해졌다."}if(type==="rest"){S.energy=Math.min(100,S.energy+22);S.stress=Math.max(0,S.stress-12);result="충분히 쉬었다. 몸이 조금 가벼워졌다."}if(type==="meet"){S.energy-=6;S.affinity+=2;S.stress=Math.max(0,S.stress-3);result="멤버와 시간을 보냈다. 별것 아닌 대화가 의외로 도움이 됐다."}S.time=advanceTime(S.time,90);save();alert(result);home()}
function advanceTime(t,mins){let [h,mi]=t.split(":").map(Number);mi+=mins;h+=Math.floor(mi/60);mi%=60;return String(h%24).padStart(2,"0")+":"+String(mi).padStart(2,"0")}
function endDay(){S.day++;S.weekday=(S.weekday+1)%7;S.time="09:40";S.energy=Math.max(8,S.energy-5);S.stress=Math.max(0,S.stress-4);save();alert("하루가 끝났다. 내일은 새로운 날이다.");home()}
function profile(){view="profile";app.innerHTML=top()+`<main class="wrap"><div class="eyebrow">CHARACTER STATUS</div><h1 class="title">${m().name}</h1><section class="hero card" style="background:${m().color}"><h2>${m().tag}</h2><p>${m().intro}</p><div class="art">${m().emoji}</div></section>${stats()}<div class="card"><div class="row"><div><small class="sub">친밀도</small><h2>${S.affinity}</h2></div><div><small class="sub">팔로워</small><h2>${S.followers}</h2></div><div><small class="sub">자산</small><h2>${S.money.toLocaleString()}원</h2></div></div></div><h3>플레이 기록</h3><div class="card"><p class="sub">선택 기록 ${S.logs.length}개</p>${S.logs.slice(-5).reverse().map(l=>`<div class="event"><div class="time">DAY ${l.day}</div><div><b>스토리 선택</b><small>EP.${l.step+1} · 선택 ${l.choice+1}</small></div></div>`).join("")||"아직 기록이 없습니다."}</div><button class="btn secondary" onclick="choose()">캐릭터 변경</button><button class="btn ghost" onclick="resetGame()">처음부터 다시</button></main>`+nav()}
function phone(){view="phone";app.innerHTML=top()+`<main class="wrap"><div class="eyebrow">MESSENGER</div><h1 class="title">자라섬 단체방</h1><div class="chat"><div class="msg"><div class="who">돗챠</div>오늘 방송 끝나고 뭐 먹을 사람?</div><div class="msg"><div class="who">하밍</div>먹는 얘기는 왜 항상 진심이야 ㅋㅋ</div><div class="msg"><div class="who">뚜닝</div>난 방송 일정 보고.</div><div class="msg"><div class="who">으네</div>각자 일정 공유해. 괜히 당일에 꼬이지 말고~</div><div class="msg"><div class="who">빅윈</div>오늘 일정은 무리하지 말고. 필요한 거 있으면 말해.</div><div class="msg mine"><div class="who">${m().name}</div>나 오늘은 ${S.energy<40?"좀 쉬어야 할 것 같아":"방송 준비 중이야"}.</div><div class="msg"><div class="who">루뭉</div>저도 방송 시작하는 거 아직 떨려요...</div></div><p class="sub">채팅은 캐릭터 관계와 스토리 진행에 따라 추가 이벤트가 열린다.</p><button class="btn secondary" onclick="home()">돌아가기</button></main>`+nav()}
function schedule(){view="schedule";app.innerHTML=top()+`<main class="wrap"><div class="eyebrow">CALENDAR</div><h1 class="title">${S.day}일차 일정</h1><div class="card"><div class="event"><div class="time">09:40</div><div><b>기상 / 휴대폰 확인</b><small>하루 시작</small></div></div><div class="event"><div class="time">12:00</div><div><b>점심 및 자유 시간</b><small>컨디션에 따라 활동</small></div></div><div class="event"><div class="time">15:00</div><div><b>콘텐츠 준비</b><small>선택한 활동에 따라 변경</small></div></div><div class="event"><div class="time">19:00</div><div><b>방송 / 개인 일정</b><small>플레이어가 결정</small></div></div><div class="event"><div class="time">23:30</div><div><b>하루 마무리</b><small>다음 날로 이동</small></div></div></div><div class="calgrid">${Array.from({length:28},(_,i)=>`<div class="${i+1===S.day?'today':''}">${i+1}</div>`).join("")}</div><p class="sub">실제 일정은 선택에 따라 달라지며, 모든 행동이 하루를 소비하는 것은 아니다.</p><button class="btn" onclick="endDay()">하루 마무리</button></main>`+nav()}
function go(v){if(!S.started&&v!=="home"&&v!=="select"){choose();return}if(v==="home")home();if(v==="story")story();if(v==="phone")phone();if(v==="schedule")schedule();if(v==="profile")profile()}
function selectRoute(i){S.route=i;save();choose()}
function resetGame(){if(confirm("현재 저장 데이터를 삭제하고 처음부터 시작할까?")){S=cloneInitial();save();choose()}}
window.go=go;window.selectRoute=selectRoute;window.startRoute=startRoute;window.pick=pick;window.activity=activity;window.endDay=endDay;window.resetGame=resetGame;
try{if(!S.started||S.route==null)choose();else home();}catch(err){console.error("JARASUM LIFE startup error",err);app.innerHTML='<main style="font-family:system-ui;padding:24px;color:#433847"><h2>게임 화면을 불러오지 못했어요</h2><p>새로고침하거나 저장 데이터를 초기화해 주세요.</p><button onclick="localStorage.removeItem(\'jarasum_save_v2\');location.reload()" style="padding:12px;border:0;border-radius:12px;background:#a984a8;color:white">저장 데이터 초기화 후 재시작</button></main>';}
window.addEventListener("error",function(e){console.error("JARASUM LIFE error",e.error||e.message);});
</script></body></html>
